<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LangGraph Policy QA</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #18212f;
      --muted: #5f6b7a;
      --line: #d6deea;
      --accent: #0b67d1;
      --danger: #bc1f2d;
      --ok: #1a7f37;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f7faff, #eef3fa);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(16, 33, 61, 0.06);
      margin-bottom: 16px;
    }
    .title {
      font-size: 22px;
      margin: 0 0 6px 0;
    }
    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    input, textarea, button {
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 14px;
      padding: 10px 12px;
    }
    input, textarea {
      background: #fff;
      color: var(--ink);
    }
    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      box-sizing: border-box;
    }
    .grow { flex: 1; min-width: 220px; }
    button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    .pill {
      display: inline-block;
      font-size: 12px;
      color: #0a3d79;
      background: #e9f2ff;
      border: 1px solid #c8ddfb;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .error {
      color: var(--danger);
      white-space: pre-wrap;
    }
    .ok {
      color: var(--ok);
      white-space: pre-wrap;
      font-size: 13px;
      margin-top: 8px;
    }
    pre {
      background: #f7f9fc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      overflow: auto;
      margin: 8px 0 0 0;
      font-size: 12px;
    }
    .hidden { display: none; }
    .progress-wrap {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fbff;
    }
    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 12px;
      background: #e7edf7;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-inner {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0b67d1, #23a4ff);
      transition: width 0.35s ease;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">LangGraph Policy QA</h1>
      <p class="sub">登录后输入问题，系统将执行由模型自决的多轮图谱查询（最多9轮）并返回推演答案。</p>
    </div>

    <div id="loginCard" class="card">
      <div class="row">
        <input id="username" class="grow" placeholder="用户名" />
        <input id="password" class="grow" type="password" placeholder="密码" />
        <button id="loginBtn">登录</button>
      </div>
      <p id="loginMsg" class="error"></p>
    </div>

    <div id="qaCard" class="card hidden">
      <div class="row">
        <span id="userPill" class="pill"></span>
        <button id="logoutBtn" class="secondary">退出</button>
      </div>
      <div class="row">
        <textarea id="question" placeholder="请输入问题，例如：若2025年高峰期分时电价上调10%，对电力销售总额可能有什么影响？"></textarea>
      </div>
      <div class="row">
        <button id="askBtn">开始推演</button>
      </div>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-head">
          <span id="progressText">第 0 / 9 轮</span>
          <span id="progressState">待开始</span>
        </div>
        <div class="progress-bar">
          <div id="progressInner" class="progress-inner"></div>
        </div>
      </div>

      <p id="askMsg" class="error"></p>
      <p id="jobMsg" class="ok"></p>
    </div>

    <div id="resultCard" class="card hidden">
      <h3>最终答案</h3>
      <pre id="answerBox"></pre>
      <h3>多轮查询轨迹</h3>
      <pre id="traceBox"></pre>
    </div>
  </div>

  <script>
    let polling = false;

    async function api(path, method, body) {
      const resp = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(data.detail || ("HTTP " + resp.status));
      }
      return data;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setLoggedIn(username) {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("qaCard").classList.remove("hidden");
      document.getElementById("userPill").textContent = "已登录: " + username;
    }

    function setLoggedOut() {
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("qaCard").classList.add("hidden");
      document.getElementById("resultCard").classList.add("hidden");
      document.getElementById("progressWrap").classList.add("hidden");
      document.getElementById("loginMsg").textContent = "";
      document.getElementById("askMsg").textContent = "";
      document.getElementById("jobMsg").textContent = "";
      polling = false;
    }

    function setProgress(currentRound, maxRounds, status, percent) {
      const pWrap = document.getElementById("progressWrap");
      const pText = document.getElementById("progressText");
      const pState = document.getElementById("progressState");
      const pInner = document.getElementById("progressInner");
      pWrap.classList.remove("hidden");
      pText.textContent = `第 ${currentRound} / ${maxRounds} 轮`;
      pState.textContent = status;
      pInner.style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    async function refreshHealth() {
      const data = await fetch("/api/health").then(r => r.json());
      if (data.authenticated) {
        setLoggedIn("neo4j");
      } else {
        setLoggedOut();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      try {
        const data = await api("/api/login", "POST", { username, password });
        setLoggedIn(data.username);
      } catch (e) {
        msg.textContent = e.message;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await api("/api/logout", "POST");
      setLoggedOut();
    });

    async function pollJob(jobId) {
      const askMsg = document.getElementById("askMsg");
      const jobMsg = document.getElementById("jobMsg");
      const answerBox = document.getElementById("answerBox");
      const traceBox = document.getElementById("traceBox");
      const askBtn = document.getElementById("askBtn");

      while (polling) {
        try {
          const status = await api(`/api/ask/status/${jobId}`, "GET");
          const stateText = status.status === "running" ? "运行中" : (status.status === "completed" ? "已完成" : "失败");
          setProgress(status.current_round || 0, status.max_rounds || 9, stateText, status.progress || 0);

          traceBox.textContent = JSON.stringify(
            {
              status: status.status,
              current_round: status.current_round,
              max_rounds: status.max_rounds,
              stop_reason: status.stop_reason,
              steps: status.steps
            },
            null,
            2
          );

          if (status.status === "completed") {
            polling = false;
            askBtn.disabled = false;
            jobMsg.textContent = `任务完成，执行到第 ${status.current_round} 轮。`;
            document.getElementById("resultCard").classList.remove("hidden");
            answerBox.textContent = status.final_answer || "(无返回)";
            askMsg.textContent = "";
            setProgress(status.current_round || 0, status.max_rounds || 9, "已完成", 100);
            return;
          }

          if (status.status === "failed") {
            polling = false;
            askBtn.disabled = false;
            askMsg.textContent = status.error || "任务失败";
            jobMsg.textContent = "";
            return;
          }
        } catch (e) {
          polling = false;
          askBtn.disabled = false;
          askMsg.textContent = e.message;
          return;
        }

        await sleep(1200);
      }
    }

    document.getElementById("askBtn").addEventListener("click", async () => {
      const question = document.getElementById("question").value.trim();
      const askMsg = document.getElementById("askMsg");
      const jobMsg = document.getElementById("jobMsg");
      const answerBox = document.getElementById("answerBox");
      const traceBox = document.getElementById("traceBox");
      const askBtn = document.getElementById("askBtn");

      askMsg.textContent = "";
      jobMsg.textContent = "";
      answerBox.textContent = "";
      traceBox.textContent = "";
      document.getElementById("resultCard").classList.remove("hidden");

      if (!question) {
        askMsg.textContent = "问题不能为空";
        return;
      }
      if (polling) {
        askMsg.textContent = "已有任务在运行，请等待完成";
        return;
      }

      askBtn.disabled = true;
      try {
        const started = await api("/api/ask/start", "POST", { question });
        polling = true;
        setProgress(0, started.max_rounds || 9, "已启动", 0);
        jobMsg.textContent = `任务已启动，ID: ${started.job_id}`;
        await pollJob(started.job_id);
      } catch (e) {
        askBtn.disabled = false;
        askMsg.textContent = e.message;
      }
    });

    refreshHealth().catch(() => setLoggedOut());
  </script>
</body>
</html>

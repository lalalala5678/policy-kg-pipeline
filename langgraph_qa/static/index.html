<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LangGraph Policy QA</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #18212f;
      --muted: #5f6b7a;
      --line: #d6deea;
      --accent: #0b67d1;
      --danger: #bc1f2d;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f7faff, #eef3fa);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(16, 33, 61, 0.06);
      margin-bottom: 16px;
    }
    .title {
      font-size: 22px;
      margin: 0 0 6px 0;
    }
    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    input, textarea, button {
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 14px;
      padding: 10px 12px;
    }
    input, textarea {
      background: #fff;
      color: var(--ink);
    }
    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      box-sizing: border-box;
    }
    .grow { flex: 1; min-width: 220px; }
    button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    .pill {
      display: inline-block;
      font-size: 12px;
      color: #0a3d79;
      background: #e9f2ff;
      border: 1px solid #c8ddfb;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .error {
      color: var(--danger);
      white-space: pre-wrap;
    }
    pre {
      background: #f7f9fc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      overflow: auto;
      margin: 8px 0 0 0;
      font-size: 12px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">LangGraph Policy QA</h1>
      <p class="sub">登录后输入问题，系统将执行多轮图谱查询并返回推演答案。</p>
    </div>

    <div id="loginCard" class="card">
      <div class="row">
        <input id="username" class="grow" placeholder="用户名" />
        <input id="password" class="grow" type="password" placeholder="密码" />
        <button id="loginBtn">登录</button>
      </div>
      <p id="loginMsg" class="error"></p>
    </div>

    <div id="qaCard" class="card hidden">
      <div class="row">
        <span id="userPill" class="pill"></span>
        <button id="logoutBtn" class="secondary">退出</button>
      </div>
      <div class="row">
        <textarea id="question" placeholder="请输入问题，例如：若2025年高峰期分时电价上调10%，对电力销售总额可能有什么影响？"></textarea>
      </div>
      <div class="row">
        <button id="askBtn">开始推演</button>
      </div>
      <p id="askMsg" class="error"></p>
    </div>

    <div id="resultCard" class="card hidden">
      <h3>最终答案</h3>
      <pre id="answerBox"></pre>
      <h3>多轮查询轨迹</h3>
      <pre id="traceBox"></pre>
    </div>
  </div>

  <script>
    async function api(path, method, body) {
      const resp = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(data.detail || ("HTTP " + resp.status));
      }
      return data;
    }

    function setLoggedIn(username) {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("qaCard").classList.remove("hidden");
      document.getElementById("userPill").textContent = "已登录: " + username;
    }

    function setLoggedOut() {
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("qaCard").classList.add("hidden");
      document.getElementById("resultCard").classList.add("hidden");
      document.getElementById("loginMsg").textContent = "";
      document.getElementById("askMsg").textContent = "";
    }

    async function refreshHealth() {
      const data = await fetch("/api/health").then(r => r.json());
      if (data.authenticated) {
        setLoggedIn("neo4j");
      } else {
        setLoggedOut();
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("loginMsg");
      msg.textContent = "";
      try {
        const data = await api("/api/login", "POST", { username, password });
        setLoggedIn(data.username);
      } catch (e) {
        msg.textContent = e.message;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await api("/api/logout", "POST");
      setLoggedOut();
    });

    document.getElementById("askBtn").addEventListener("click", async () => {
      const question = document.getElementById("question").value.trim();
      const msg = document.getElementById("askMsg");
      const answerBox = document.getElementById("answerBox");
      const traceBox = document.getElementById("traceBox");
      msg.textContent = "";
      answerBox.textContent = "";
      traceBox.textContent = "";
      if (!question) {
        msg.textContent = "问题不能为空";
        return;
      }
      try {
        const data = await api("/api/ask", "POST", { question });
        document.getElementById("resultCard").classList.remove("hidden");
        answerBox.textContent = data.result.final_answer || "(无返回)";
        traceBox.textContent = JSON.stringify(
          {
            subquestions: data.result.subquestions,
            steps: data.result.steps
          },
          null,
          2
        );
      } catch (e) {
        msg.textContent = e.message;
      }
    });

    refreshHealth().catch(() => setLoggedOut());
  </script>
</body>
</html>
